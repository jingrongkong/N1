name: build

# 注意：这是「自签注入」旧路线的构建（产出 DYFudai.dylib）。
# 当前主路线是 windows/ 下的 WDA 外部驱动，不需要本 workflow。
# 因此改为只手动触发：不再随 push 自动跑，省时间也省 Actions 额度。
on:
  workflow_dispatch:

jobs:
  build:
    # macOS 14 镜像已于 2026-11-02 全面下线，改用 macos-15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ldid 与 Theos
        run: |
          brew install ldid xz make 2>/dev/null || brew install ldid xz
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: 编译 dylib
        run: |
          make clean 2>/dev/null || true
          make -j4

      - name: 收集产物
        run: |
          mkdir -p out
          find . -name "*.dylib" -not -path "./out/*" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: DYFudai-dylib
          path: out/*.dylib
          if-no-files-found: error
